server:
  port: ${PORT:8080}

spring:
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s

guardian:
  api:
    key: ${GUARDIAN_API_KEY:}

nyt:
  api:
    key: ${NYT_API_KEY:}

news:
  guardian:
    enabled: true
  nyt:
    enabled: true
  cache-ttl: 6h
  provider-timeout: 5s
  max-page-size: 25
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    probes:
      enabled: true

logging:
  level:
    root: INFO

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
