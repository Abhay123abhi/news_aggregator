server:
  port: ${PORT:8080}

spring:
  cache:
    type: redis
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: ${NEWS_CONNECT_TIMEOUT_MS:10000}
            readTimeout: ${NEWS_READ_TIMEOUT_MS:20000}
  data:
    redis:
      url: ${REDIS_URL:redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s

guardian:
  api:
    key: ${GUARDIAN_API_KEY:}

nyt:
  api:
    key: ${NYT_API_KEY:}

ai:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}

news:
  guardian:
    enabled: true
  nyt:
    enabled: true
  cache-ttl: ${NEWS_CACHE_TTL:30m}
  provider-timeout: ${NEWS_PROVIDER_TIMEOUT:35s}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

logging:
  level:
    root: INFO

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
