services:
  - type: keyvalue
    name: abhay123abhi-news-cache
    region: singapore
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: abhay123abhi-news-api
    region: singapore
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: GUARDIAN_API_KEY
        sync: false
      - key: NYT_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: abhay123abhi-news-cache
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://abhay123abhi-news-web.onrender.com

  - type: web
    name: abhay123abhi-news-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/build
    routes:
      - type: rewrite
        source: /api/*
        destination: https://abhay123abhi-news-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
