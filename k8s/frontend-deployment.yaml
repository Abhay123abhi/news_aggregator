apiVersion: apps/v1
kind: Deployment
metadata:
  name: news-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: news-frontend
  template:
    metadata:
      labels:
        app: news-frontend
    spec:
      containers:
        - name: news-frontend
          image: abhayjais/news-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80